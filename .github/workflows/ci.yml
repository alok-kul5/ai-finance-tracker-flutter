name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test, build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21' # AGP 9 lint needs JDK 21

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib/data/database.g.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Sync stays off unless the repository has these secrets; the app is
      # fully usable without them.
      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: >
          flutter build apk --release --target-platform android-arm64
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk kharcha-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kharcha-apk
          path: kharcha-*.apk
          if-no-files-found: error

  release:
    name: GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kharcha-apk
      - uses: softprops/action-gh-release@v2
        with:
          files: kharcha-*.apk
          generate_release_notes: true
